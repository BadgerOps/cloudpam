# Default values for cloudpam-agent

# Image configuration
image:
  repository: ghcr.io/badgerops/cloudpam/agent
  pullPolicy: IfNotPresent
  # Empty means the chart appVersion. Release image tags carry no leading "v".
  tag: ""

imagePullSecrets: []

# Agent configuration
config:
  # CloudPAM server URL (required)
  serverUrl: "https://cloudpam.example.com"

  # Account ID to discover (required)
  accountId: 1

  # Stable agent identity. Empty means <namespace>-<release>-cloudpam-agent, so the
  # agent keeps the same registration across pod restarts and two releases in
  # different namespaces of one cluster get different names. The agent derives its
  # ID from the server URL, this name, and the account ID, so when more than one
  # cluster reports to the same account, set a value unique across those clusters.
  agentName: ""

  # Sync interval (default: 15m)
  syncInterval: "15m"

  # Heartbeat interval (default: 1m)
  heartbeatInterval: "1m"

  # AWS regions to discover (empty = default region)
  awsRegions: []
  # Example:
  # awsRegions:
  #   - us-east-1
  #   - us-west-2

  # HTTP settings
  maxRetries: 3
  retryBackoff: "5s"
  requestTimeout: "30s"

  # AWS Organizations mode: assume a role in every member account.
  awsOrg:
    enabled: false
    roleName: ""          # CloudPAMDiscoveryRole
    externalId: ""
    regions: []           # falls back to awsRegions
    excludeAccounts: []   # account IDs as strings

# API key for authentication (required)
# Can be provided directly or via existingSecret
apiKey: ""

# Use existing secret for API key
# The secret must have a key named "api-key"
existingSecret: ""

# Service account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (for IRSA, Workload Identity, etc.)
  annotations: {}
  # Example for AWS IRSA:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/cloudpam-discovery
  # The name of the service account to use
  name: ""

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Security context for pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Security context for container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Environment variables
env: []
# Example:
# env:
#   - name: AWS_REGION
#     value: us-east-1

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []
