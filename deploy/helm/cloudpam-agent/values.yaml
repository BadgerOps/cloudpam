# Default values for cloudpam-agent

# Image configuration
image:
  repository: ghcr.io/badgerops/cloudpam/agent
  pullPolicy: IfNotPresent
  # Empty means the chart appVersion. Release image tags carry no leading "v".
  tag: ""

imagePullSecrets: []

# Agent configuration
config:
  # CloudPAM server URL (required)
  serverUrl: "https://cloudpam.example.com"

  # Account ID to discover (required)
  accountId: 1

  # Stable agent identity (required). The agent derives its ID from the server URL,
  # this name, and the account ID. Use a name unique across every cluster that
  # reports to the same CloudPAM server and account.
  agentName: ""

  # Cloud provider this agent discovers (required): aws or gcp. There is no
  # default; one agent serves one provider.
  provider: ""

  # Sync interval (default: 15m)
  syncInterval: "15m"

  # Heartbeat interval (default: 1m)
  heartbeatInterval: "1m"

  # AWS regions to discover (empty = default region)
  awsRegions: []
  # Example:
  # awsRegions:
  #   - us-east-1
  #   - us-west-2

  # Cap on AWS API calls per second, shared by every account in an org-mode
  # pass. Set it when a large organization hits EC2 throttling. 0 is unlimited.
  discoveryAwsRps: 0

  # HTTP settings
  maxRetries: 3
  retryBackoff: "5s"
  requestTimeout: "30s"

  # AWS Organizations mode: assume a role in every member account.
  awsOrg:
    enabled: false
    roleName: ""          # CloudPAMDiscoveryRole
    externalId: ""
    regions: []           # falls back to awsRegions
    excludeAccounts: []   # account IDs as strings

  # GCP project to discover in single-project mode (required when provider is
  # gcp and gcpOrg is disabled).
  gcpProject: ""

  # GCP regions to keep (empty = all regions). Networks are global.
  gcpRegions: []

  # Cap on GCP API calls per second (Compute, Resource Manager, IAM
  # Credentials), shared by every project in an org pass. 0 is unlimited.
  discoveryGcpRps: 0

  # GCP organization/folder mode: discover every active project under parent.
  gcpOrg:
    enabled: false
    parent: ""                     # organizations/<id> or folders/<id>
    regions: []                    # falls back to gcpRegions
    excludeProjects: []            # project IDs
    # Empty: read every project as the agent's own identity (grant
    # roles/browser + roles/compute.networkViewer on the parent).
    # Set: impersonate this service account per project; {project} is replaced
    # by each project ID.
    impersonateServiceAccount: ""

# GCP service-account key, for clusters without Workload Identity. The secret
# must hold the key JSON under "key.json"; it is mounted read-only and
# GOOGLE_APPLICATION_CREDENTIALS points at it.
gcpCredentials:
  existingSecret: ""

# API key for authentication (required)
# Can be provided directly or via existingSecret
apiKey: ""

# Use existing secret for API key
# The secret must have a key named "api-key"
existingSecret: ""

# Service account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (for IRSA, Workload Identity, etc.)
  annotations: {}
  # Example for AWS IRSA:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/cloudpam-discovery
  # Example for GKE Workload Identity:
  # annotations:
  #   iam.gke.io/gcp-service-account: cloudpam-agent@my-project.iam.gserviceaccount.com
  # The name of the service account to use
  name: ""

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Security context for pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Security context for container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Environment variables
env: []
# Example:
# env:
#   - name: AWS_REGION
#     value: us-east-1

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []
