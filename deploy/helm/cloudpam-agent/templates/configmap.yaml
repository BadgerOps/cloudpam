{{- $agentName := required "config.agentName is required and must be unique for this CloudPAM server and account" (.Values.config.agentName | trim) -}}
{{- $provider := required "config.provider is required (aws or gcp)" (.Values.config.provider | trim) -}}
{{- if not (has $provider (list "aws" "gcp")) }}{{ fail (printf "config.provider is required (aws or gcp), got %q" $provider) }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudpam-agent.fullname" . }}
  labels:
    {{- include "cloudpam-agent.labels" . | nindent 4 }}
data:
  agent.yaml: |
    server_url: {{ .Values.config.serverUrl | quote }}
    account_id: {{ .Values.config.accountId }}
    agent_name: {{ $agentName | quote }}
    provider: {{ $provider | quote }}
    sync_interval: {{ .Values.config.syncInterval | quote }}
    heartbeat_interval: {{ .Values.config.heartbeatInterval | quote }}
    {{- if .Values.config.awsRegions }}
    aws_regions:
      {{- range .Values.config.awsRegions }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.config.discoveryAwsRps }}
    discovery_aws_rps: {{ . }}
    {{- end }}
    max_retries: {{ .Values.config.maxRetries }}
    retry_backoff: {{ .Values.config.retryBackoff | quote }}
    request_timeout: {{ .Values.config.requestTimeout | quote }}
    {{- if .Values.config.awsOrg.enabled }}
    aws_org:
      enabled: true
      {{- with .Values.config.awsOrg.roleName }}
      role_name: {{ . | quote }}
      {{- end }}
      {{- with .Values.config.awsOrg.externalId }}
      external_id: {{ . | quote }}
      {{- end }}
      {{- with .Values.config.awsOrg.regions }}
      regions:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.config.awsOrg.excludeAccounts }}
      exclude_accounts:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with .Values.config.gcpProject }}
    gcp_project: {{ . | quote }}
    {{- end }}
    {{- with .Values.config.gcpRegions }}
    gcp_regions:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.config.discoveryGcpRps }}
    discovery_gcp_rps: {{ . }}
    {{- end }}
    {{- if .Values.config.gcpOrg.enabled }}
    gcp_org:
      enabled: true
      parent: {{ required "config.gcpOrg.parent is required when config.gcpOrg.enabled" .Values.config.gcpOrg.parent | quote }}
      {{- with .Values.config.gcpOrg.regions }}
      regions:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.config.gcpOrg.excludeProjects }}
      exclude_projects:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.config.gcpOrg.impersonateServiceAccount }}
      impersonate_service_account: {{ . | quote }}
      {{- end }}
    {{- end }}
