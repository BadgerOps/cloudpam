{{- include "cloudpam-server.validateStorage" . }}
{{- $sqlite := eq .Values.storage.backend "sqlite" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudpam-server.fullname" . }}
  labels:
    {{- include "cloudpam-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ ternary "Recreate" "RollingUpdate" $sqlite }}
  selector:
    matchLabels:
      {{- include "cloudpam-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.vector.enabled }}
        checksum/vector: {{ include (print $.Template.BasePath "/vector-configmap.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "cloudpam-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cloudpam-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.vector }}
      {{- if .enabled }}
      # A native sidecar starts before the server and stops after it, so audit
      # events sent during startup and graceful shutdown still reach Vector.
      initContainers:
      - name: vector
        restartPolicy: Always
        securityContext:
          {{- toYaml $.Values.securityContext | nindent 12 }}
        image: "{{ .image.repository }}:{{ .image.tag }}"
        imagePullPolicy: {{ .image.pullPolicy }}
        args: ["--config", "/etc/vector/vector.toml"]
        {{- with .env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .resources | nindent 12 }}
        volumeMounts:
          - name: vector-config
            mountPath: /etc/vector
            readOnly: true
          - name: vector-data
            mountPath: /var/lib/vector
      {{- end }}
      {{- end }}
      containers:
      - name: server
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        envFrom:
          - configMapRef:
              name: {{ include "cloudpam-server.fullname" . }}
          - secretRef:
              name: {{ include "cloudpam-server.secretName" . }}
        {{- $chartDatabaseUrl := and (not $sqlite) (not (include "cloudpam-server.databaseUrlFromEnv" .)) }}
        {{- if or $chartDatabaseUrl .Values.env }}
        env:
          {{- if $chartDatabaseUrl }}
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ include "cloudpam-server.secretName" . }}
                key: DATABASE_URL
          {{- end }}
          {{- with .Values.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- if or $sqlite .Values.extraVolumeMounts }}
        volumeMounts:
          {{- if $sqlite }}
          - name: data
            mountPath: /data
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
      {{- if or $sqlite .Values.extraVolumes .Values.vector.enabled }}
      volumes:
        {{- if and $sqlite .Values.storage.sqlite.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cloudpam-server.fullname" . }}-data
        {{- else if $sqlite }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.vector.enabled }}
        - name: vector-config
          configMap:
            name: {{ include "cloudpam-server.fullname" . }}-vector
        - name: vector-data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
