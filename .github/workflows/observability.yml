name: Observability stack
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'deploy/docker-compose.observability.yml'
      - 'deploy/prometheus/**'
      - 'deploy/grafana/**'
      - '.github/workflows/observability.yml'
  pull_request:
    paths:
      - 'deploy/docker-compose.observability.yml'
      - 'deploy/prometheus/**'
      - 'deploy/grafana/**'
      - '.github/workflows/observability.yml'

permissions:
  contents: read

jobs:
  validate:
    name: validate compose and configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.observability.yml config -q
      - name: Check Prometheus config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.48.0 check config /etc/prometheus/prometheus.yml
      - name: Check Grafana provisioning and dashboards parse
        run: |
          python3 - <<'PY'
          import glob, json, yaml
          for f in glob.glob('deploy/grafana/provisioning/**/*.yaml', recursive=True):
              yaml.safe_load(open(f))
              print('ok', f)
          for f in glob.glob('deploy/grafana/dashboards/*.json'):
              json.load(open(f))
              print('ok', f)
          PY
      - name: Check compose bind mounts exist
        run: |
          missing=0
          for src in $(docker compose -f deploy/docker-compose.observability.yml config --format json | python3 -c 'import json,sys; [print(v["source"]) for s in json.load(sys.stdin)["services"].values() for v in s.get("volumes", []) if v["type"] == "bind"]'); do
            [ -e "$src" ] || { echo "missing bind mount source: $src"; missing=1; }
          done
          exit $missing
