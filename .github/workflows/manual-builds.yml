name: Cortana smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: CloudPAM Go tests on Cortana
    runs-on: [self-hosted, linux, x64, cloudpam-cortana]
    timeout-minutes: 20
    steps:
      - name: Verify runner environment
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -eux
          echo "Runner: $RUNNER_NAME"
          id
          uname -a
          cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max
          gcc --version
      - name: Checkout CloudPAM master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 969140bd97b5a83009f43621c206bccb7aff2f9c
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34
        with:
          go-version: '1.25.x'
          cache: false
      - name: Run domain tests with race detector
        run: go test -race -count=1 -v ./internal/domain/...
